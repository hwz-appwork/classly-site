<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classly</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#232b36;--txt:#e9eef5;--dim:#8a95a5;--acc:#7c9cff}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);
font:16px/1.7 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;padding:24px}
.card{max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 28px}
h1{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
p{color:var(--dim);margin:0 0 20px}
a{color:var(--acc);text-decoration:none;font-weight:600}
ul{padding-left:18px;color:#c9d3df;font-size:14.5px}
footer{margin-top:22px;color:#5f6a7a;font-size:12.5px}
</style></head><body>
<div class="card">
  <h1>Classly</h1>
  <p>A free, offline-first timetable &amp; homework app for Android.<br>No account. No ads. No internet permission.</p>
  <ul>
    <li><a href="privacy.html">Privacy Policy</a></li>
    <li><a href="https://github.com/hwz-appwork/classly">Source &amp; design docs</a></li>
  </ul>
  <footer>In development — not yet available on Google Play.</footer>
</div>
</body></html>
